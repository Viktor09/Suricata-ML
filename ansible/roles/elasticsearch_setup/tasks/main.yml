---
- name: Create elasticsearch config directory
  file:
    path: "{{ elasticsearch_dir }}/config/certs"
    state: directory
    mode: '0750'
    owner: root
    group: root

- name: Copy Elasticsearch certificates
  copy:
    src: "{{ playbook_dir }}/../elasticsearch-9.4.2/config/certs/{{ item }}"
    dest: "{{ elasticsearch_dir }}/config/certs/{{ item }}"
    mode: '0640'
  loop:
    - http.p12
    - http_ca.crt
    - transport.p12

- name: Copy Elasticsearch keystore
  copy:
    src: "{{ playbook_dir }}/../elasticsearch-9.4.2/config/elasticsearch.keystore"
    dest: "{{ elasticsearch_dir }}/config/elasticsearch.keystore"
    mode: '0640'
