---
- name: Deploy SOCcare infrastructure
  hosts: soccare
  become: true
  vars:
    infrastructure_dir: /home/ubuntu/infrastructure
    elasticsearch_dir: /home/ubuntu/elasticsearch-9.4.2
    elastic_password: "password"
    kibana_token: "token"

  roles:
    - docker
    - elasticsearch_setup
    - infrastructure
    - elk_stack
